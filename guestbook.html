<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindSync Solutions ::: Guestbook</title>
    <link href="style.css" rel="stylesheet" type="text/css">
</head>
<body>

    <table class="page-wrapper">
        <tbody>
            <tr>
                <td colspan="2" class="header">
                    <!-- Header from index.html, modified for this page -->
                    <table>
                        <tbody>
                            <tr>
                                <td style="width:60px; padding:8px; border:none; vertical-align:middle;">
                                    <div class="logo-placeholder">
                                        <div style="font-size: 8px;"><img src="/df-01-05/public/logo.png" width="100">
                                        </div>
                                    </div>
                                </td>
                                <td style="padding:8px; border:none; vertical-align:middle;">
                                    <h1 style="font-size: 14px; color: #000; margin: 0; font-weight: bold;"
                                        data-i18n="companyTitle">MindSync Solutions</h1>
                                    <div style="font-size: 12px; color: #666; margin-top: 2px;"
                                        data-i18n="protocolVersion">Consciousness Transfer Protocol v2.0</div>
                                </td>
                                <td style="text-align:right; padding:8px; border:none; vertical-align:middle;">
                                    <div class="nav-menu" style="margin-bottom: 6px;">
                                        <a onclick="goToPage('home')"><span data-i18n="home">Home</span></a> |
                                        <a onclick="goToPage('scanner')"><span data-i18n="scanner">Scanner</span></a> |
                                        <a onclick="goToPage('pricing')"><span data-i18n="pricing">Pricing</span></a> |
                                        <a onclick="goToPage('store')"><span data-i18n="store">Store</span></a> |
                                        <span data-i18n="guestbook">Guestbook</span>
                                    </div>
                                    <div class="lang-toggle">
                                        <button data-lang="en">EN</button>
                                        <button data-lang="fr">FR</button>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </td>
            </tr>
            <tr>
                <td style="width:180px; vertical-align:top; padding:0; border:none;">
                    <div class="ad-sidebar" id="adSidebar"></div>
                </td>
                <td style="vertical-align:top; padding:0; border:none;">
                    <div class="content">
                        <h1 data-i18n="guestbookTitle">Client Testimonials</h1>
                        <p data-i18n="guestbookDescription">Read what our synergized clients have to say about their new
                            digital existence!</p>

                        <table class="content-table" style="width: 100%; font-size: 12px; margin-top: 20px;">
                            <tbody id="guestbookComments">
                            </tbody>
                        </table>
                    </div>
                </td>
            </tr>
            <tr>
                <td colspan="2" class="footer">
                    <div style="margin-top: 8px; font-size: 10px;">
                        © 2026 MindSync Solutions Inc. | All Rights Reserved
                    </div>
                </td>
            </tr>
        </tbody>
    </table>

    <script src="comments.js"></script>
    <script src="app.js"></script>
    <script src="mousetrail.js"></script>
    <script>
        function renderGuestbookComments() {
            const tbody = document.getElementById('guestbookComments');
            const lang = getCurrentLang();
            guestbookComments.forEach(comment => {
                const row = document.createElement('tr');
                const commentText = typeof comment.comment === 'string' 
                    ? comment.comment 
                    : (comment.comment[lang] || comment.comment['en']);
                row.innerHTML = `
                    <td style="width: 150px; vertical-align: top;">
                        <strong>${comment.name}</strong><br>
                        <span style="font-size: 12px;">Date: ${comment.date}</span>
                    </td>
                    <td>
                        <p>"${commentText}"</p>
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        setDocumentTitle('guestbookPageTitle', 'MindSync Solutions ::: Guestbook');
        document.addEventListener('DOMContentLoaded', function () {
            renderAdSidebar('adSidebar', 3);
            renderGuestbookComments();
        });
    </script>

</body>
</html>
